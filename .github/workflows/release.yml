name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Windows EXE
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -Release

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/LatencyMonitor.exe
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/LatencyMonitor.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/LatencyMonitor.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iPadOS / iOS App
        run: |
          xcodebuild \
            -project ios/LatencyMonitor.xcodeproj \
            -scheme LatencyMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          rm -rf Payload release/LatencyMonitor.ipa
          mkdir -p Payload release
          cp -R ios/build/Build/Products/Release-iphoneos/LatencyMonitor.app Payload/
          zip -r -y release/LatencyMonitor.ipa Payload
          ls -lh release/LatencyMonitor.ipa

      - name: Upload iPadOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: release/LatencyMonitor.ipa
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        run: ls -lh dist/

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "LatencyMonitor ${{ steps.tag.outputs.name }}"
          draft: false
          prerelease: false
          body: |
            ## 网络延迟与地域悬浮窗（全平台三端发布）

            实时显示 **Google / Cloudflare / Oracle** 延迟（`< 800ms` 绿色）与当前网络地域（不显示 IP）。

            ### v1.2.1 更新：iPadOS / iOS 超扁单行胶囊模式

            **iOS / iPadOS (`LatencyMonitor.ipa`)**
            - **超扁单行胶囊模式**（默认开启）：画布由原先两行 `640×120` 压扁为单行 `720×64`（11.25:1，隐藏地域时为 `520×60`），将地域与 `G / CF / OCI` 延迟紧凑排在同一行内，显著降低画中画垂直占用
            - 切换「超扁单行胶囊 / 详细纵卡」时自动 `flushAndRemoveImage()` 刷新画中画比例，不再残留旧高度；轻点画中画中间按钮也可直接切换两种模式
            - 详细纵卡继续保留每个目标的 `延迟 · HTTP 状态 · 均/低/高` 与底部 `运营商 · ASN`

            **Android (`LatencyMonitor.apk`) & Windows (`LatencyMonitor.exe`)**
            - 保持 v1.2.0 全量能力（`< 800ms` 绿色、近 20 次统计、运营商与 ASN 详情）

            ### 安装说明
            - **Windows**：单文件免安装，双击即用（需系统自带 .NET Framework 4.x）
            - **Android**：Android 8.0+，安装后授予「显示在其他应用上层」权限
            - **iOS**：未签名 `.ipa`，支持 TrollStore 巨魔或 Sideloadly / AltStore 自签安装，使用画中画悬浮窗
          files: |
            dist/LatencyMonitor.exe
            dist/LatencyMonitor.apk
            dist/LatencyMonitor.ipa
