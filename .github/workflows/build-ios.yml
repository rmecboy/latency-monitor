name: Build iPadOS / iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iPadOS / iOS App
        run: |
          xcodebuild \
            -project ios/LatencyMonitor.xcodeproj \
            -scheme LatencyMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package LatencyMonitor.ipa
        run: |
          rm -rf Payload release/LatencyMonitor.ipa
          mkdir -p Payload release
          cp -R ios/build/Build/Products/Release-iphoneos/LatencyMonitor.app Payload/
          zip -r -y release/LatencyMonitor.ipa Payload
          ls -lh release/LatencyMonitor.ipa

      - name: Upload LatencyMonitor.ipa
        uses: actions/upload-artifact@v4
        with:
          name: LatencyMonitor-iPadOS-IPA
          path: release/LatencyMonitor.ipa
          if-no-files-found: error
