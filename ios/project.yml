name: LatencyMonitor
options:
  bundleIdPrefix: com.latencymonitor
  deploymentTarget:
    iOS: "15.0"

targets:
  LatencyMonitor:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: LatencyMonitor
        PRODUCT_BUNDLE_IDENTIFIER: com.latencymonitor.app
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
