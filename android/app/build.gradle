plugins {
    id 'com.android.application'
}

android {
    namespace 'com.latencymonitor.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.latencymonitor.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android Framework SDK — zero external dependencies for fast builds & minimal APK size
}
